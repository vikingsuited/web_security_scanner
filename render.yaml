services:
  - type: web
    name: web-security-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SCANNER_BLOCK_PRIVATE   # stops visitors scanning internal/private IPs
        value: "1"
